name: Film stills

# Renders a few frames of a sample film on the runner's CPU (no Modal GPU), with the Google
# key and Sketchfab token, to check a change quickly. The stills go to the diagnostics branch.

on:
  workflow_dispatch:
    inputs:
      lat: {description: "Latitude", default: "33.8938"}
      lon: {description: "Longitude", default: "35.5018"}
      seconds: {description: "Film length in seconds", default: "60"}
      frames: {description: "Frames to render (preview quality is 24 fps)", default: "1,60,110,150,185,235,285,330,700,1100,1420"}
      ifc: {description: "IFC in the repository", default: "samples/sample-building.ifc"}

permissions:
  contents: write

jobs:
  stills:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          sudo apt-get -qq install -y ffmpeg libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libegl1 libgomp1 > /dev/null
          pip install -q bpy==5.2.3 "ifcopenshell>=0.8" numpy pillow flask
      - name: Render the stills
        env:
          SITETWIN_GOOGLE_KEY: ${{ secrets.SITETWIN_GOOGLE_KEY }}
          SITETWIN_SKETCHFAB_TOKEN: ${{ secrets.SITETWIN_SKETCHFAB_TOKEN }}
          LAT: ${{ inputs.lat }}
          LON: ${{ inputs.lon }}
          SECONDS: ${{ inputs.seconds }}
          FRAMES: ${{ inputs.frames }}
          IFC: ${{ inputs.ifc }}
        run: |
          PYTHONPATH=. python -m sitetwin_worker render "$IFC" --out work --lat "$LAT" --lon "$LON" \
            --seconds "$SECONDS" --quality preview --frames "$FRAMES" 2>&1 \
            | grep -v "^Fra:\|HIPEW\|CUEW\| INFO" | sed "s/$SITETWIN_GOOGLE_KEY/…/g; s/$SITETWIN_SKETCHFAB_TOKEN/…/g" | tail -40
          mkdir -p out && cp work/frames/*.png out/ 2>/dev/null || true
      - name: Keep the stills
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ github.run_id }}
        run: |
          cd out
          for f in *; do mv "$f" "$RUN-$f"; done
          git init -q -b diagnostics
          git config user.name "SiteTwin" && git config user.email "sitetwin@users.noreply.github.com"
          git remote add origin "https://x-access-token:$TOKEN@github.com/$REPO.git"
          git fetch -q origin diagnostics && git reset -q --soft FETCH_HEAD || true
          git add . && git commit -qm "Film stills from run $RUN" && git push -q origin HEAD:diagnostics
