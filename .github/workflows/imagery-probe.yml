name: Imagery probe (temporary)
on:
  push:
    branches: [claude/imagery-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/modelled-surroundings
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Gather Sibline's surroundings (radius 1500 m)
        run: |
          pip install -q numpy pillow
          python -c "
          from pathlib import Path
          from sitetwin_worker import environment as E
          m = E.gather(33.651153, 35.405074, 1500, Path('env'))
          print(m.get('missing'), m.get('osm', {}).get('counts'))
          "
          mkdir out && tar czf out/env-sibline-1500.tgz env && ls -la out
          cd out && git init -q -b sample-films && git config user.name SiteTwin && git config user.email sitetwin@users.noreply.github.com
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch -q origin sample-films && git reset -q --soft FETCH_HEAD || true
          git add -- . && git commit -qm "Environment probe" && git push -q origin HEAD:sample-films
