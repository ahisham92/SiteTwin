name: Imagery probe (temporary)
on:
  push:
    branches: [claude/imagery-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the aerial tiles around Sibline
        run: |
          pip install -q pillow
          python - <<'PY'
          import math, urllib.request, io
          from PIL import Image
          lat, lon, z, R = 33.651153, 35.405074, 17, 4
          n = 2 ** z
          fx = (lon + 180) / 360 * n
          fy = (1 - math.asinh(math.tan(math.radians(lat))) / math.pi) / 2 * n
          cx, cy = int(fx), int(fy)
          S = 256
          W = Image.new('RGB', ((2*R+1)*S, (2*R+1)*S))
          for dy in range(-R, R+1):
              for dx in range(-R, R+1):
                  u = f"https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{cy+dy}/{cx+dx}"
                  im = Image.open(io.BytesIO(urllib.request.urlopen(u, timeout=30).read())).convert('RGB')
                  W.paste(im, ((dx+R)*S, (dy+R)*S))
          W.save('mosaic.png')
          PY
          mkdir out && mv mosaic.png out/imagery-probe-z17.png
          cd out && git init -q -b sample-films && git config user.name SiteTwin && git config user.email sitetwin@users.noreply.github.com
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch -q origin sample-films && git reset -q --soft FETCH_HEAD || true
          git add -- . && git commit -qm "Imagery probe" && git push -q origin HEAD:sample-films
