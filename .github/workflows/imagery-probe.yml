name: Imagery probe (temporary)
on:
  push:
    branches: [claude/imagery-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch OpenStreetMap around Sibline
        run: |
          Q='[out:json][timeout:90];(way["building"](around:1600,33.651153,35.405074);way["highway"](around:1600,33.651153,35.405074);way["landuse"](around:1600,33.651153,35.405074);way["natural"](around:1600,33.651153,35.405074);way["man_made"](around:1600,33.651153,35.405074);way["leisure"](around:1600,33.651153,35.405074);way["amenity"="parking"](around:1600,33.651153,35.405074);relation["building"](around:1600,33.651153,35.405074);relation["landuse"](around:1600,33.651153,35.405074););out geom;'
          mkdir out
          for u in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter; do
            curl -sf --data-urlencode "data=$Q" "$u" -o out/osm-sibline.json && break
          done
          ls -la out; head -c 300 out/osm-sibline.json
          curl -s -o /dev/null -w "cors: %{http_code}\n" -H "Origin: https://example.com" -I https://overpass-api.de/api/status || true
          curl -s -D - -o /dev/null -H "Origin: https://example.com" --data-urlencode "data=[out:json];node(1);out;" https://overpass-api.de/api/interpreter | grep -i access-control || true
          cd out && git init -q -b sample-films && git config user.name SiteTwin && git config user.email sitetwin@users.noreply.github.com
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch -q origin sample-films && git reset -q --soft FETCH_HEAD || true
          git add -- . && git commit -qm "OSM probe" && git push -q origin HEAD:sample-films
