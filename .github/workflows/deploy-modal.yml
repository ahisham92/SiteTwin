name: Deploy renderer to Modal

# Puts the render worker on Modal whenever main changes (or when run by hand).
# Needs four repository secrets: MODAL_TOKEN_ID and MODAL_TOKEN_SECRET (from
# modal.com → Settings → API tokens), SITETWIN_SITE_URL (SiteTwin's address on
# the website, e.g. https://example.com/sitetwin) and SITETWIN_WORKER_TOKEN (any
# long random string, also set on the website).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      gpu:
        description: "GPU type (T4, L4, A10G, L40S, A100)"
        default: "L4"
      max_gpus:
        description: "Most GPUs one film may use at once"
        default: "10"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      SITETWIN_GPU: ${{ inputs.gpu || 'L4' }}
      SITETWIN_MAX_GPUS: ${{ inputs.max_gpus || '10' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "modal>=1.0"
      - name: Check the secrets are there and look right (values are never printed)
        env:
          SITE_URL: ${{ secrets.SITETWIN_SITE_URL }}
          WORKER_TOKEN: ${{ secrets.SITETWIN_WORKER_TOKEN }}
        run: |
          ok=1
          check() {  # name, value, expected prefix
            v="$(printf '%s' "$2" | tr -d '[:space:]')"
            if [ -z "$v" ]; then echo "::error::Secret $1 is missing or empty"; ok=0
            elif [ -n "$3" ] && [ "${v#"$3"}" = "$v" ]; then echo "::error::Secret $1 does not start with $3 (is it the right value?)"; ok=0
            elif [ "$v" != "$2" ]; then echo "::warning::Secret $1 has spaces or a line break in it; they are ignored"
            else echo "$1 looks right"; fi
          }
          check MODAL_TOKEN_ID "$MODAL_TOKEN_ID" ak-
          check MODAL_TOKEN_SECRET "$MODAL_TOKEN_SECRET" as-
          check SITETWIN_SITE_URL "$SITE_URL" http
          check SITETWIN_WORKER_TOKEN "$WORKER_TOKEN" ""
          [ "$ok" = 1 ] || exit 1
          # pass the trimmed tokens on to the next steps
          echo "MODAL_TOKEN_ID=$(printf '%s' "$MODAL_TOKEN_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "MODAL_TOKEN_SECRET=$(printf '%s' "$MODAL_TOKEN_SECRET" | tr -d '[:space:]')" >> "$GITHUB_ENV"
      - name: Check the render machine can reach the site with this token
        env:
          SITE_URL: ${{ secrets.SITETWIN_SITE_URL }}
          WORKER_TOKEN: ${{ secrets.SITETWIN_WORKER_TOKEN }}
        run: |
          base="${SITE_URL%/}"
          echo "Site address ends with: ...${base: -12}"
          css=$(curl -s -o /dev/null -w '%{http_code}' "$base/static/sitetwin.css")
          echo "SiteTwin stylesheet at that address: HTTP $css (200 means the address is right)"
          # job 0 never exists: 404 means the token was accepted, 401 means it was not
          auth=$(curl -s -o /tmp/r.txt -w '%{http_code}' -X POST -H "Authorization: Bearer $WORKER_TOKEN" \
                 -H 'Content-Type: application/json' -d '{}' "$base/api/worker/jobs/0/failed")
          echo "Worker API with the token: HTTP $auth (404 = token accepted, 401 = token rejected)"
          head -c 300 /tmp/r.txt; echo
          [ "$css" = 200 ] || { echo "::error::SITETWIN_SITE_URL does not point at SiteTwin (it should end in /sitetwin)"; exit 1; }
          [ "$auth" = 404 ] || { echo "::error::The site rejected SITETWIN_WORKER_TOKEN: it must match the site's exactly"; exit 1; }
      - name: Store the site's address and token on Modal
        run: |
          modal secret create sitetwin \
            SITETWIN_SITE_URL="${{ secrets.SITETWIN_SITE_URL }}" \
            SITETWIN_WORKER_TOKEN="${{ secrets.SITETWIN_WORKER_TOKEN }}" --force
      - name: Deploy
        run: modal deploy modal_app.py
