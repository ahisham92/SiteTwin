name: Find free 3D models

# Lists free-licence downloadable Sketchfab models for each kind of site equipment.

on:
  push:
    branches: [claude/google-fill]
    paths: [tools/sketchfab_search.py]
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/sketchfab_search.py
