name: Preview the 3D models

# Downloads the Sketchfab models (with SITETWIN_SKETCHFAB_TOKEN, never printed) and renders each
# as the film stands it up, to the diagnostics branch.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          sudo apt-get -qq install -y libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libegl1 libgomp1 > /dev/null
          pip install -q bpy==5.2.3 numpy pillow
      - name: Render the models
        env:
          SITETWIN_SKETCHFAB_TOKEN: ${{ secrets.SITETWIN_SKETCHFAB_TOKEN }}
        run: |
          mkdir -p out
          PYTHONPATH=. python tools/model_preview.py out 2>&1 | grep -v "^Fra:\|HIPEW\|INFO" | sed "s/$SITETWIN_SKETCHFAB_TOKEN/…/g"
      - name: Keep the pictures
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ github.run_id }}
        run: |
          cd out
          for f in *; do mv "$f" "$RUN-$f"; done
          git init -q -b diagnostics
          git config user.name "SiteTwin" && git config user.email "sitetwin@users.noreply.github.com"
          git remote add origin "https://x-access-token:$TOKEN@github.com/$REPO.git"
          git fetch -q origin diagnostics && git reset -q --soft FETCH_HEAD || true
          git add . && git commit -qm "Model preview from run $RUN" && git push -q origin HEAD:diagnostics
